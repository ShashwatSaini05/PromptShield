version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../PromptShield/model:/app/model:ro
    environment:
      - DATABASE_URL=sqlite:///./promptshield.db
      - MODEL_DIR=/app/model
      - SECRET_KEY=change-me-in-production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000
